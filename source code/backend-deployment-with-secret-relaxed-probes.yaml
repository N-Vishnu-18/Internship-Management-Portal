apiVersion: apps/v1
kind: Deployment
metadata:
  name: intmnt-backend
  labels:
    app: intmnt-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: intmnt-backend
  template:
    metadata:
      labels:
        app: intmnt-backend
    spec:
      containers:
        - name: intmnt-backend
          image: nvishnuvardhan/intmnt:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            # Inject DB URL from the secret to avoid quoting issues
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: DB_URL
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: DB_URL
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
          # Relax probes: use "/" instead of /health and give more startup time
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
